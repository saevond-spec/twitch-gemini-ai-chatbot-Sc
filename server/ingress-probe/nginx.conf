include /etc/nginx/modules-enabled/*.conf;
worker_processes 1;
pid /tmp/obs-probe-nginx.pid;
error_log /tmp/obs-nginx-error.log warn;
events { worker_connections 128; }
rtmp {
    server {
        listen 127.0.0.1:1935;
        chunk_size 4096;
        application app {
            live on;
            record off;
            allow publish all;
            allow play 127.0.0.1;
            deny play all;
        }
    }
}
http {
    access_log off;
    client_body_temp_path /tmp/obs-nginx-client;
    proxy_temp_path /tmp/obs-nginx-proxy;
    fastcgi_temp_path /tmp/obs-nginx-fastcgi;
    uwsgi_temp_path /tmp/obs-nginx-uwsgi;
    scgi_temp_path /tmp/obs-nginx-scgi;
    server {
        listen 127.0.0.1:8088;
        location = /stat { rtmp_stat all; }
    }
}
