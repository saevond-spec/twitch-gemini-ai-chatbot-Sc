name: SweatyOBS dev6 timeline APK
on:
  push:
    branches:
      - codex/dev6-fulltimeline-20261023-r1
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-obs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android 14 emulator image
        run: sdkmanager 'system-images;android-34;google_apis;x86_64'
      - name: Android 14 emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android-obs && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: sweatyobs-android-dev6-timeline-tested
          path: android-obs/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
