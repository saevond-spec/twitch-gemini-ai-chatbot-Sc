name: Android OBS debug APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'android-obs/**'
      - '.github/workflows/android-obs.yml'
  push:
    branches:
      - main
      - codex/sleipnir-dev7-fulltimeline-20261023-r1
    paths:
      - 'android-obs/**'
      - '.github/workflows/android-obs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-obs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Bind isolated synthetic PS5 and Android IPv4 addresses on CI loopback
        run: |
          sudo ip address add 10.233.31.1/32 dev lo
          sudo ip address add 10.233.31.2/32 dev lo
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android 14 emulator image with bounded retries
        run: |
          set -eu
          package='system-images;android-34;google_apis;x86_64'
          image="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          for attempt in 1 2 3; do
            echo "Emulator system image installation attempt $attempt"
            if sdkmanager "$package" && test -f "$image/system.img"; then
              echo "Android 14 image is present"
              break
            fi
            if test "$attempt" -eq 3; then
              echo "Android 14 system image unavailable after 3 attempts" >&2
              exit 1
            fi
            rm -rf "$image" "$ANDROID_HOME/.temp"
            sleep 8
          done
      - name: 'Android 14 emulator: press Start and verify service response'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android-obs && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload tested APK for release publishing
        uses: actions/upload-artifact@v4
        with:
          name: sweatyobs-android-debug-tested
          path: android-obs/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweatyobs-emulator-results
          path: android-obs/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-apk:
    name: Publish standalone APK
    needs: android-debug
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: sweatyobs-android-debug-tested
          path: ${{ runner.temp }}/apk
      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: android-debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mv "${{ runner.temp }}/apk/app-debug.apk" "${{ runner.temp }}/apk/sweatyobs-android-debug.apk"
          gh release create "$TAG_NAME" "${{ runner.temp }}/apk/sweatyobs-android-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SweatyObs Android debug APK (build $GITHUB_RUN_NUMBER)" \
            --notes "Passed Android unit and Android 14 emulator tests. Built from commit $GITHUB_SHA."
