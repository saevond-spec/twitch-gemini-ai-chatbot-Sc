services:
  - type: web
    name: your-bot-name
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      # ═══════════════════════════════════════════════════════════════════
      # REQUIRED: Twitch Bot Configuration
      # ═══════════════════════════════════════════════════════════════════
      - key: TWITCH_USERNAME
        value: "your-bot-username"
      - key: JOIN_CHANNELS
        value: "your-channel-1,your-channel-2"
      - key: TWITCH_CLIENT_ID
        value: "your-twitch-client-id"
      - key: TWITCH_CLIENT_SECRET
        value: "your-twitch-client-secret"

      # ═══════════════════════════════════════════════════════════════════
      # REQUIRED: AI & API Keys
      # ═══════════════════════════════════════════════════════════════════
      - key: DEEPSEEK_API_KEY
        value: "your-deepseek-api-key"
      - key: POLLINATIONS_API_KEY
        value: "your-pollinations-api-key"
      - key: REDIS_URL
        value: "your-upstash-redis-url"

      # ═══════════════════════════════════════════════════════════════════
      # OPTIONAL: Command Names (customizable triggers)
      # ═══════════════════════════════════════════════════════════════════
      - key: BOT_COMMAND_NAME
        value: "!ask,@yourbotusername"
      - key: IMAGE_COMMAND_NAME
        value: "!image"
      - key: VIDEO_COMMAND_NAME
        value: "!video"
      - key: TTS_COMMAND_NAME
        value: "!tts"
      - key: MUSIC_COMMAND_NAME
        value: "!song"

      # ═══════════════════════════════════════════════════════════════════
      # OPTIONAL: Emote Providers
      # ═══════════════════════════════════════════════════════════════════
      - key: ENABLE_7TV_EMOTES
        value: "true"
      - key: ENABLE_BTTV_EMOTES
        value: "true"
      - key: ENABLE_FFZ_EMOTES
        value: "true"
      - key: ENABLE_EMOTE_APPENDING
        value: "true"
      - key: EMOTE_APPEND_EXCLUDE_PREFIXES
        value: "!settitle"

      # ═══════════════════════════════════════════════════════════════════
      # OPTIONAL: Behavior Tuning
      # ═══════════════════════════════════════════════════════════════════
      - key: COOLDOWN_DURATION
        value: "1"
      - key: ENABLE_SEARCH_GROUNDING
        value: "true"
      - key: DEEPSEEK_MODEL
        value: "deepseek-chat"
      - key: POLLINATIONS_IMAGE_MODEL
        value: "gptimage"
      - key: POLLINATIONS_VIDEO_MODEL
        value: "seedance"
      - key: POLLINATIONS_TTS_MODEL
        value: "elevenlabs"
      - key: POLLINATIONS_TTS_VOICE
        value: "charlotte"
      - key: POLLINATIONS_MUSIC_MODEL
        value: "elevenmusic"
      - key: AI_MAX_TOKENS
        value: "450"
      - key: AI_HISTORY_LENGTH
        value: "10"
      - key: CHAT_CONTEXT_LENGTH
        value: "10"
      - key: IGNORED_USERNAMES
        value: "StreamElements,Nightbot"
      - key: AUTO_MESSAGE_ENABLED
        value: "true"
      - key: AUTO_USE_DEEPSEEK
        value: "true"
      - key: AUTO_CHAT_TICK_SECONDS
        value: "30"
      - key: AUTO_CHAT_MIN_QUIET_SECONDS
        value: "90"
      - key: AUTO_CHAT_MAX_QUIET_SECONDS
        value: "360"
      - key: AUTO_CHAT_BOT_GAP_SECONDS
        value: "120"
      - key: AUTO_CHAT_RECENT_BOT_WINDOW_SECONDS
        value: "600"
      - key: AUTO_CHAT_REQUIRE_LIVE
        value: "true"
      - key: ANALYTICAL_AUTO_COMMENT_ENABLED
        value: "true"
      - key: ANALYTICAL_MOMENT_COOLDOWN_SECONDS
        value: "90"
      - key: HIGHLIGHT_DETECTION_ENABLED
        value: "true"
      - key: HIGHLIGHT_WINDOW_SECONDS
        value: "20"
      - key: HIGHLIGHT_COOLDOWN_SECONDS
        value: "150"
      - key: HIGHLIGHT_MAX_CLIPS
        value: "5"
      - key: HIGHLIGHT_AUTO_SCORE_THRESHOLD
        value: "64"
      - key: HIGHLIGHT_AI_FALLBACK_SCORE
        value: "84"
      - key: MANUAL_CLIP_SECONDS
        value: "35"
      - key: MANUAL_CLIP_COOLDOWN_SECONDS
        value: "45"
      - key: VIEWER_CLIP_VOTE_WINDOW_SECONDS
        value: "12"
      - key: VIEWER_CLIP_VOTES_REQUIRED
        value: "2"
      - key: WELCOME_ON_JOIN
        value: "true"
      - key: JOIN_WELCOME_BATCH_MS
        value: "2500"
      - key: JOIN_WELCOME_DEDUPE_MINUTES
        value: "360"
      - key: JOIN_WELCOME_WARMUP_SECONDS
        value: "60"

      # ═══════════════════════════════════════════════════════════════════
      # OPTIONAL: Additional API Keys
      # ═══════════════════════════════════════════════════════════════════
      - key: YOUTUBE_API_KEY
        value: "your-youtube-api-key"
      - key: WORKERS_ENABLED
        value: "true"
      - key: WORKER_QUEUES
        value: "auto"
      - key: BULLMQ_DRAIN_DELAY_SECONDS
        value: "120"
      - key: BULLMQ_STALLED_INTERVAL_SECONDS
        value: "300"
      - key: REDIS_REQUIRED
        value: "false"
      - key: ADMIN_API_KEY
        sync: false

      - key: YOUTUBE_UPLOAD_ENABLED
        value: "false"
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_DEFAULT_PRIVACY
        value: "private"
      - key: YOUTUBE_ALLOW_PUBLIC
        value: "false"
      - key: TIKTOK_UPLOAD_ENABLED
        value: "false"
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: DISCORD_ANNOUNCE_ENABLED
        value: "false"
      - key: DISCORD_WEBHOOK_URL
        sync: false

      - key: SALES_ENGINE_ENABLED
        value: "true"
      - key: SALES_VIEWER_COOLDOWN_DAYS
        value: "30"
      - key: SALES_CHANNEL_COOLDOWN_MINUTES
        value: "15"
      - key: SALES_CONVERSION_COOLDOWN_DAYS
        value: "30"
      - key: SALES_OFFERS_JSON
        value: ""
      - key: BRANDED_CONTENT_DISCLOSURE_CONFIRMED
        value: "false"
      - key: RETENTION_ENGINE_ENABLED
        value: "true"
      - key: RETENTION_MIN_SCORE
        value: "0.56"
      - key: RETENTION_MIN_PROMPT_GAP_SECONDS
        value: "45"
      - key: RETENTION_REPLY_WINDOW_SECONDS
        value: "120"
      - key: LURKER_ACTIVATION_ENABLED
        value: "true"
      - key: LURKER_MIN_SILENT_SECONDS
        value: "180"
      - key: LURKER_PROMPT_GAP_SECONDS
        value: "240"
      - key: LURKER_REPLY_WINDOW_SECONDS
        value: "120"
      - key: LURKER_MIN_OPPORTUNITY
        value: "0.42"
      - key: LURKER_TRACKING_WARMUP_SECONDS
        value: "90"
